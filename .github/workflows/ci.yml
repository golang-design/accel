name: ci

# Tier 1 from specs/011-conformance-harness.md section 11: the CPU backend on
# Linux, macOS, and Windows, with the race detector, the fuzz seed corpus, the
# per-package coverage gate, formatting, vet, and the cgo-free check. Every one
# of these runs on every commit, because each of them rots silently.
#
# Tier 2 arrives with Metal at M6 and is a separate workflow: a job that
# promises a backend and finds no device is a failure, not a skip, so it cannot
# share a matrix with the jobs that promise only the CPU.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  # CGO_ENABLED=0 is the point, not an optimization: specs/000-decisions.md
  # decision 2 makes cgo-free a hard requirement, so the build that must pass is
  # the one without it.
  CGO_ENABLED: '0'

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'
        check-latest: true

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    # The race detector needs cgo on most platforms, so this is the one step
    # that turns it on. The cgo-free guarantee is about what the library
    # compiles to, not about what the test harness may use to find a race, and
    # the build and vet steps above already proved the library itself.
    - name: Test under the race detector
      env:
        CGO_ENABLED: '1'
      run: go test -race ./...

  fuzz:
    name: fuzz seed corpus
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'
        check-latest: true

    # A short run rather than the committed corpus alone: the corpus proves the
    # known failures stay fixed, and a minute of fresh input is what finds the
    # next one. Anything it finds is written to testdata and becomes permanent,
    # per specs/011-conformance-harness.md section 7.
    - name: Fuzz the allocators
      env:
        CGO_ENABLED: '1'
      run: |
        go test -race -run=xxx -fuzz=FuzzTLSF -fuzztime=60s ./internal/alloc/
        go test -race -run=xxx -fuzz=FuzzBump -fuzztime=30s ./internal/alloc/

  generate:
    name: generated files are fresh
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'
        check-latest: true

    # A kernel edited without regenerating leaves a source and a generated file
    # that disagree, and nothing else notices: both halves still compile, and
    # the backend runs the stale one. The generated files are committed so this
    # comparison can exist at all.
    - name: Check generated kernels
      run: go run ./cmd/accel-kernel -check ./...

    # Belt and braces: regenerating must also leave the tree unchanged, which
    # catches a generator whose output depends on something the digest does not
    # cover.
    - name: Regenerate and diff
      run: |
        go generate ./...
        if ! git diff --exit-code; then
          echo "::error::go generate changed files that are committed; commit the result"
          exit 1
        fi

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'
        check-latest: true

    # Per package, not one repository average: an average lets a well-tested
    # package carry an untested one and reports a number nobody can act on. The
    # only exclusions are the two checked rules in
    # specs/011-conformance-harness.md section 10.1, and the report prints what
    # each package excluded so a high score on a package that is mostly
    # unimplemented is visible as exactly that.
    - name: Measure
      run: go test -coverprofile=cover.out -coverpkg=./... ./...

    - name: Gate
      run: go run ./internal/conformance/cover/covercheck -profile=cover.out

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-profile
        path: cover.out

  cgo-free:
    name: no cgo anywhere
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # Greps rather than relying on the build: a file can import "C" behind a build
    # tag that this platform does not select, and still be a violation.
    - name: Reject import "C"
      run: |
        if grep -rn --include='*.go' '^import "C"\|^\s*"C"$' . ; then
          echo "::error::found cgo usage; specs/000-decisions.md decision 2 makes cgo-free a hard requirement"
          exit 1
        fi
        echo "no cgo found"

  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.x'
        check-latest: true
    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "::error::these files are not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi
        echo "all files formatted"
